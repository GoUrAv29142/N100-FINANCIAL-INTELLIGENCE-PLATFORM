# Screener configuration - Sprint 3, Day 15-16
# Analyst-editable thresholds for the 6 preset screeners and the
# custom filter engine. Column names match src/analytics/engine.py's
# financial_ratios output exactly.

filters:
  roe_min:
    column: return_on_equity_pct
    direction: min
  de_max:
    column: debt_to_equity
    direction: max
    skip_for_financials: true
  fcf_min:
    column: free_cash_flow_cr
    direction: min
  revenue_cagr_5yr_min:
    column: revenue_cagr_5yr
    direction: min
  pat_cagr_5yr_min:
    column: pat_cagr_5yr
    direction: min
  opm_min:
    column: operating_profit_margin_pct
    direction: min
  pe_max:
    column: pe_ratio
    direction: max
  pb_max:
    column: pb_ratio
    direction: max
  dividend_yield_min:
    column: dividend_yield_pct
    direction: min
  icr_min:
    column: interest_coverage
    direction: min
    debt_free_always_passes: true
  market_cap_min:
    column: market_cap_crore
    direction: min
  net_profit_min:
    column: net_profit
    direction: min
  eps_cagr_5yr_min:
    column: eps_cagr_5yr
    direction: min
  asset_turnover_min:
    column: asset_turnover
    direction: min
  sales_min:
    column: sales
    direction: min

presets:
  quality_compounder:
    name: "Quality Compounder"
    filters:
      roe_min: 15
      de_max: 1.0
      fcf_min: 0
      revenue_cagr_5yr_min: 10
    rank_by: composite_quality_score
    rank_desc: true

  value_pick:
    name: "Value Pick"
    filters:
      pe_max: 20
      pb_max: 3.0
      de_max: 2.0
      dividend_yield_min: 1
    rank_by: composite_quality_score
    rank_desc: true

  growth_accelerator:
    name: "Growth Accelerator"
    filters:
      pat_cagr_5yr_min: 20
      revenue_cagr_5yr_min: 15
      de_max: 2.0
    rank_by: pat_cagr_5yr
    rank_desc: true

  dividend_champion:
    name: "Dividend Champion"
    filters:
      dividend_yield_min: 2
      fcf_min: 0
    dividend_payout_max: 80
    rank_by: dividend_yield_pct
    rank_desc: true

  debt_free_blue_chip:
    name: "Debt-Free Blue Chip"
    filters:
      de_equals: 0
      roe_min: 12
      sales_min: 5000
    rank_by: return_on_equity_pct
    rank_desc: true

  turnaround_watch:
    name: "Turnaround Watch"
    filters:
      revenue_cagr_3yr_min: 10
      fcf_min: 0
    de_declining_yoy: true
    rank_by: revenue_cagr_3yr
    rank_desc: true